# ads.yaml — TipGuard Phase 1 Google Ads search screen
#
# Generated by /distribute. Phase 1 is a 100-paid-click demand screen, not a
# growth campaign: manual CPC, phrase match, Search-only, $250 hard cap.
#
# Read together with:
#   .claude/stacks/distribution/google-ads.md  (Phase 1 Playbook, cost model)
#   experiment/experiment.yaml                  (h-01 / h-02 / h-03, variants)

channel: google-ads
campaign_name: tipguard-search-v1
project_name: tipguard
landing_url: https://tipguard.draftlabs.org
phase: 1

# Update this to the ACTUAL launch date if the campaign is created on a later
# day — /iterate --check computes campaign age from this field.
campaign_created_at: 2026-08-26

# --- Keywords -----------------------------------------------------------------
# The intent tiers below document why each term is here. Phase 1 uploads ALL of
# them as PHRASE match (playbook.match_type), so the exact/broad grouping is a
# record of intent, not the match type you type into the Google Ads UI.
keywords:
  exact:
    - tip credit notice
    - tip credit notice software
    - tip credit compliance software
    - dol tip audit
    - tip credit notice requirements
    - tip credit acknowledgment form
    - restaurant tip pooling compliance
  phrase:
    - tip credit notice
    - tip pooling rules
    - tip credit audit
    - restaurant labor compliance
  broad:
    - restaurant payroll compliance
    - tipped employee notice
  # Campaign-specific negatives. The 50 universal negatives live in
  # playbook.negative_keywords and are ADDED to these at upload (union).
  negative:
    - tip calculator
    - tip out calculator
    - tipping etiquette
    - how much to tip
    - tip pooling app
    - tip distribution software
    - waitress tips
    - server tips
    - tip jar
    - uber tips
    - doordash tips
    - tax on tips
    - no tax on tips
    - tip credit card processing

# --- Creative -----------------------------------------------------------------
# The Phase 1 Playbook caps this at 1 ad group / 2 RSAs, so the three
# experiment.yaml variants are NOT split across ad groups here — 100 clicks
# divided three ways cannot separate three messages. Both RSAs point at
# /v/audit-risk (also DEFAULT_VARIANT at the site root), whose headline "One
# Missing Signature Voids Every Tip Credit You Ever Took" is what these
# headlines are shortened from (messaging.md message match). Splitting the
# variants across ad groups is a Phase 2 concern.
final_url: "https://tipguard.draftlabs.org/v/audit-risk?utm_source=google&utm_medium=cpc&utm_campaign=tipguard-search-v1&utm_content=audit-risk"
ads:
  # RSA 1 — the exposure hook (matches the variant headline directly)
  - headlines:
      - One Signature Voids It All
      - Tip Credit Notice Software
      - Your Tip Credit Paperwork
      - Signed Notices, Dated File
      - Free Audit-Readiness Score
      - State-Specific Tip Notices
      - Built For Restaurants
      - Score Your Exposure Free
    descriptions:
      - Generate state-specific tip-credit notices, collect signed acknowledgments, keep the file.
      - Payroll pays your staff. It does not keep the notice file a DOL auditor asks for first.
      - Answer 7 questions, get your audit-readiness score and back-pay exposure estimate.
  # RSA 2 — the audit-file hook (same page, different door in)
  - headlines:
      - DOL Tip Audit Ready
      - Tip Credit Compliance
      - Notices Signed and Dated
      - For Restaurant Owners
      - One Export, Whole File
      - Stop Voiding Your Credit
      - Check Your Exposure
    descriptions:
      - Tip-credit notices, e-signed acknowledgments, and violation checks in one audit file.
      - Overtime off the $2.13 base and managers in the pool void the credit. Find yours today.
      - Start with the free score. See your gaps ranked before an investigator does.

# --- Sitelinks ----------------------------------------------------------------
# golden_path also lists /score, /staff and /notices, but all three sit behind
# the signup gate: a logged-out ad click 307s to /signup and the redirect DROPS
# the UTM query string, so the visit lands in PostHog unattributed. /signup is
# the only real logged-out page destination; the other three slots are landing
# anchors, the documented fallback when independent pages run short.
sitelinks:
  - link_text: Create your account
    description_1: The account unlocks your score
    description_2: Free score, no card required
    final_url: "https://tipguard.draftlabs.org/signup?utm_source=google&utm_medium=cpc&utm_campaign=tipguard-search-v1&utm_content=sitelink_signup"
  - link_text: See the exposure math
    description_1: What one missing notice costs
    description_2: Per tipped worker, per hour
    final_url: "https://tipguard.draftlabs.org?utm_source=google&utm_medium=cpc&utm_campaign=tipguard-search-v1&utm_content=sitelink_anchor_exposure#exposure"
  - link_text: How TipGuard works
    description_1: Roster in, signed notices out
    description_2: One session, no consultant
    final_url: "https://tipguard.draftlabs.org?utm_source=google&utm_medium=cpc&utm_campaign=tipguard-search-v1&utm_content=sitelink_anchor_how#how-it-works"
  - link_text: Pricing
    description_1: $79/mo for the whole file
    description_2: Cancel any time
    final_url: "https://tipguard.draftlabs.org?utm_source=google&utm_medium=cpc&utm_campaign=tipguard-search-v1&utm_content=sitelink_anchor_pricing#pricing"

# --- Budget -------------------------------------------------------------------
# Identity: total_budget_cents = click_target x guardrails.max_cpc_cents
#           25000              = 100          x 250
budget:
  daily_budget_cents: 2000        # $20.00/day pacing
  total_budget_cents: 25000       # $250.00 hard cap
  duration_days: 7                # nominal window -> campaign End date
  click_target: 100               # stop condition A
  initial_max_cpc_cents: 140      # $1.40 starting bid
  bidding_strategy: manual_cpc

targeting:
  locations: [US]                 # experiment.yaml target_geo — a US wage construct
  languages: [en]

conversions:
  primary_action: signup_complete
  secondary_actions: [score_completed, roster_imported]
  import_method: posthog_webhook
  # Phase 1 does NOT create Google Ads conversion actions and does NOT import
  # conversions. GO/NO_GO comes from PostHog events divided by paid clicks.

guardrails:
  max_cpc_cents: 250              # CEILING — raise bids toward it, never above
  min_daily_clicks: 3
  auto_pause_rules:
    - "clicks >= 100 -> pause and report to Team Lead (stop A)"
    - "total_spend >= 25000 cents -> pause and report; short clicks = affordability signal (stop B)"
    - "bid at 250 cents with ~0 impressions for 7 consecutive days -> pause and report a bid-capped shortfall"
    # The End date is NOT a pause rule. If the End date arrives with clicks
    # below target and spend below cap, extend the End date manually.

# --- Thresholds ---------------------------------------------------------------
thresholds:
  expected_clicks: 100
  expected_signups: 6
  expected_activations: 2
  go_signal: ">=2 roster_imported from paid traffic within the window, OR >=6 signup_complete at <= $42 CPA"
  no_go_signal: "0 signup_complete after $125 spend (half cap), OR <1% CTR after 500 impressions"

