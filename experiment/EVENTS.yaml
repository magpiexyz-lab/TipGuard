# EVENTS.yaml — Analytics Event Dictionary for TipGuard
#
# Derived from experiment.yaml golden_path, behaviors, and hypothesis formulas.
# Folded in stack-emitted events from .claude/stacks/{framework/nextjs.md,auth/supabase.md}.
#
# Rules:
#   1. Every event MUST have a funnel_stage: reach|demand|activate|monetize|retain
#   2. Naming: <object>_<action> in snake_case
#   3. Multiple events MAY share the same funnel_stage
#   4. Cross-MVP comparison aggregates by funnel_stage with distinct_id dedup
#   5. /change and /distribute can add events incrementally after bootstrap

global_properties:
  project_name:
    description: From experiment.yaml `name` field. Identifies which experiment this data belongs to.
    type: string
    required: true
  project_owner:
    description: From experiment.yaml `owner` field. Identifies who owns this experiment.
    type: string
    required: true

events:
  # ─── REACH ─────────────────────────────────────────────────────────────────
  landing_view:
    funnel_stage: reach
    trigger: User loads the TipGuard landing page (root or a variant URL /v/<slug>)
    properties:
      variant:
        type: string
        required: false
        description: Variant slug (audit-risk | cost-shield | one-click-file) — present when served from /v/<slug>
      utm_source:
        type: string
        required: false
        description: UTM source captured from the query string (meta | google | reddit | association | direct)
      utm_medium:
        type: string
        required: false
        description: UTM medium (cpc | post | newsletter | ...)
      utm_campaign:
        type: string
        required: false
        description: UTM campaign identifier
      utm_content:
        type: string
        required: false
        description: UTM content — typically the variant slug or creative id for per-creative attribution
      gclid:
        type: string
        required: false
        description: Google Click Identifier (for Google Ads conversion attribution)
      click_id:
        type: string
        required: false
        description: Generic click ID from the originating ad platform
      referrer:
        type: string
        required: false
        description: document.referrer at page load

  qualified_paid_visit:
    funnel_stage: reach
    trigger: A landing_view whose UTM or referrer matches the qualified restaurant-operator allowlist (restaurant-owner ad campaigns, r/restaurateur, state restaurant association domains)
    properties:
      source_channel:
        type: string
        required: true
        description: Classified channel (meta_restaurant | google_intent | reddit_restaurateur | association | other_paid)
      variant:
        type: string
        required: false
        description: Variant slug that received the qualified visit

  # ─── DEMAND ────────────────────────────────────────────────────────────────
  cta_click:
    funnel_stage: demand
    trigger: User clicks the primary CTA on the landing page ("Get My Free Audit-Readiness Score" / "Protect My Tip Credit" / "See My Audit File")
    properties:
      variant:
        type: string
        required: false
        description: Variant slug whose CTA was clicked
      cta_position:
        type: string
        required: false
        description: Position of the clicked CTA (hero | feature_section | footer)

  # ─── ACTIVATE ──────────────────────────────────────────────────────────────
  score_started:
    funnel_stage: activate
    trigger: Anonymous visitor answers the first question of the free audit-readiness questionnaire on /score
    properties:
      variant:
        type: string
        required: false
        description: Variant slug the visitor arrived from
      state:
        type: string
        required: false
        description: US state selected for the restaurant (two-letter code), when already answered

  score_completed:
    funnel_stage: activate
    trigger: The audit-readiness result renders after the final question on /score (h-02 numerator, h-03 denominator)
    properties:
      readiness_score:
        type: number
        required: true
        description: Computed audit-readiness score, 0-100
      gap_count:
        type: number
        required: true
        description: Number of compliance gaps identified by the questionnaire
      state:
        type: string
        required: true
        description: US state of the restaurant (two-letter code)
      estimated_exposure_usd:
        type: number
        required: false
        description: Midpoint of the estimated back-pay exposure range shown to the visitor

  signup_start:
    funnel_stage: activate
    trigger: Signup page mounts (stack-emitted by auth/supabase.md from src/app/signup/page.tsx)
    properties:
      auth_method:
        type: string
        required: false
        description: Method shown to the user (email | google | both)

  signup_complete:
    funnel_stage: activate
    trigger: Supabase auth successfully creates a user and redirect to /dashboard is initiated (stack-emitted by auth/supabase.md)
    properties:
      auth_method:
        type: string
        required: true
        description: Method used (email | google)
      had_score:
        type: boolean
        required: false
        description: Whether an anonymous audit-readiness score was carried into the new account

  roster_imported:
    funnel_stage: activate
    trigger: Owner completes a staff roster CSV import on /staff (h-05 denominator)
    properties:
      rows_total:
        type: number
        required: true
        description: Rows present in the uploaded CSV
      rows_imported:
        type: number
        required: true
        description: Rows successfully created as employee records
      rows_failed:
        type: number
        required: true
        description: Rows rejected for validation errors

  payroll_connect_clicked:
    funnel_stage: activate
    trigger: Owner clicks the "Connect Gusto / Toast" fake-door integration button on /staff
    properties:
      provider:
        type: string
        required: true
        description: Provider the owner asked for (gusto | toast | square | adp | other)

  notice_generated:
    funnel_stage: activate
    trigger: Server-side — one event per state-specific tip-credit notice persisted by POST /api/notices/generate (h-05 numerator)
    properties:
      notice_id:
        type: string
        required: true
        description: UUID of the generated notice row
      state:
        type: string
        required: true
        description: US state whose rule set was applied (two-letter code)
      rule_version:
        type: string
        required: true
        description: Version stamp of the state rule entry used to render the notice
      tip_credit_claimed:
        type: boolean
        required: true
        description: Whether the state permits and the notice claims a tip credit

  notice_sent:
    funnel_stage: activate
    trigger: Owner sends a generated notice to an employee for signature from /notices; signing email dispatched via Resend (h-04 numerator, h-06 and h-07 denominator)
    properties:
      notice_id:
        type: string
        required: true
        description: UUID of the sent notice
      employee_count:
        type: number
        required: true
        description: Number of notices dispatched in this send action
      delivery_channel:
        type: string
        required: true
        description: How the signing link was delivered (email | link_copy)

  notice_signed:
    funnel_stage: activate
    trigger: Employee submits the acknowledgment on /sign; signed record written to the vault
    properties:
      notice_id:
        type: string
        required: true
        description: UUID of the signed notice
      hours_to_sign:
        type: number
        required: false
        description: Hours elapsed between send and signature

  violation_detected:
    funnel_stage: activate
    trigger: Server-side — one event per finding produced by POST /api/violations/scan
    properties:
      rule_class:
        type: string
        required: true
        description: Rule class violated (overtime_base | ineligible_tip_pool | subminimum_shortfall | missing_notice)
      severity:
        type: string
        required: true
        description: Finding severity (critical | high | medium)
      estimated_exposure_usd:
        type: number
        required: false
        description: Estimated back-pay exposure attributable to the finding

  violation_resolved:
    funnel_stage: activate
    trigger: Owner completes the prescribed fix for a finding on /violations and marks it resolved
    properties:
      rule_class:
        type: string
        required: true
        description: Rule class of the resolved finding
      days_open:
        type: number
        required: true
        description: Whole days between detection and resolution

  feedback_submitted:
    funnel_stage: activate
    trigger: User submits the post-activation feedback widget
    properties:
      source:
        type: string
        required: false
        description: "How the user found TipGuard (google | social | friend | other)"
      feedback:
        type: string
        required: false
        description: Free-text feedback from the user
      activation_action:
        type: string
        required: true
        description: Activation step that preceded this submission (notice_sent)

  # ─── MONETIZE ──────────────────────────────────────────────────────────────
  checkout_started:
    funnel_stage: monetize
    requires: [payment]
    trigger: User clicks the upgrade CTA on /pricing or /dashboard; a Stripe Checkout session is created and the user is redirected (h-06 numerator)
    properties:
      variant:
        type: string
        required: false
        description: Variant slug the user originally arrived from
      notices_sent_at_upgrade:
        type: number
        required: true
        description: Count of notices sent at the moment of the upgrade click
      open_violation_count:
        type: number
        required: true
        description: Open compliance findings at the moment of the upgrade click

  checkout_completed:
    funnel_stage: monetize
    requires: [payment]
    trigger: Server-side — Stripe checkout.session.completed webhook processed; account plan set to 'shield'
    properties:
      plan:
        type: string
        required: true
        description: Plan activated (always 'shield' in the MVP)
      amount_usd:
        type: number
        required: true
        description: Amount charged in USD (79 baseline)

  audit_file_exported:
    funnel_stage: monetize
    trigger: Paid owner builds and downloads the audit-ready file from /audit-file
    properties:
      employee_count:
        type: number
        required: true
        description: Employees included in the export
      signed_notice_count:
        type: number
        required: true
        description: Signed notices included in the export
      open_violation_count:
        type: number
        required: true
        description: Open findings at export time

  # ─── RETAIN ────────────────────────────────────────────────────────────────
  retain_return:
    funnel_stage: retain
    trigger: User returns to the app >= 24h after their first visit (stack-emitted by framework/nextjs.md from src/components/RetainTracker.tsx)
    properties:
      days_since_first:
        type: number
        required: true
        description: Whole days elapsed since the user's first session
      has_sent_notice:
        type: boolean
        required: false
        description: Whether the user had any notice_sent event before this return
